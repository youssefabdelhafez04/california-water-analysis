[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "california-water-policy-analysis"
version = "0.1.0"
description = "Reproducible HUC4 analysis of California water use around the 2018 legislation"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openai>=2.0",
  "pandas>=2.2",
  "plotly>=5.20",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "streamlit>=1.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
